<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/utility.css" />
    <title>'Spotify - Web Player: Music for everyone'</title>
  </head>
  <body>
    <div class="container flex bg-black">
      <div class="left">
        <div class="close">
          <img class="invert" src="icons/close.svg" alt="">
        </div>
        <div class="home m-1 bg-grey rounded p-1">
          <div class="logo m-1 invert" ><img width="150px" src="icons/logo.svg" alt="logo" /></div>
          <ul>
            <li><img class="invert" src="icons/home.svg" alt="home" />Home</li>
            <li><img class="invert" src="icons/search.svg" alt="search" />Search</li>
          </ul>
        </div>

        <div class="library bg-grey rounded m-1 p-1">
          <div class="heading">
            <img src="icons/playlist.svg" class="invert" alt="" />
            <h2>Your library</h2>
          </div>
<div class="songList">
  <ul>
    
            </ul>
</div>
          <div class="footer">
            <div>
              <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy/"
                ><span>Privacy Center</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy-policy/"
                ><span>Privacy Policy</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy-policy/#s3"
                ><span>About Ads</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </div>
        </div>
      </div>

      <div class="right  bg-grey rounded">
        <div class="header">
          <div class="nav">
            <div class="hamburgerContainer">
 <img width="40px" class="invert hamburger" src="icons/hamburger.svg" alt="">
  <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                stroke="#ffffff"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path 
        d="M9 6L14.2929 11.2929C14.6262 11.6262 14.7929 11.7929 14.7929 12C14.7929 12.2071 14.6262 12.3738 14.2929 12.7071L9 18" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
    />
</svg>
            </div>
             
          
          </div>

          <div class="buttons">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
          </div>
        </div>
        <div class="spotifyplaylist">
            <h1>Spotify Playlists</h1>
            <div class="cardContainer"> </div>
            
<div class="playbar">
  <div class="seekbar">
    <div class="circle">
      
    </div>
  </div>
  <div class="abovebar">
  <div class="songinfo">
    
  </div>
  <div class="songsbuttons">
      <img id="previous" src="icons/prevsong.svg" alt="">
    <img id="play" src="icons/play.svg" alt="">
    <img id="next" src="icons/nextsong.svg" alt="">
</div>
<div class="timevol">
<div class="songtime">

</div>
<div class="volume">
  <img width="25px" src="icons/volume.svg" alt="">
  <div class="range">
<input type="range" width="25" name="volume">
  </div>
  
</div>
</div>

</div>
  </div>
        </div>
      </div>
    </div>

    <script src="JS/script.js"></script>
  </body>
</html>
